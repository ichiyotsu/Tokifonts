name: Android Release Build


on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Restore pinned debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.TOKI_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E "SHA256|Alias name" || { echo "RESTORED KEYSTORE UNREADABLE"; exit 1; }


      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'


      - name: Restore pinned debug keystore (all .android locations)
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          echo "${{ secrets.TOKI_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          echo "${{ secrets.TOKI_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.config/.android/debug.keystore"
          if [ -n "$ANDROID_SDK_HOME" ]; then mkdir -p "$ANDROID_SDK_HOME/.android"; echo "${{ secrets.TOKI_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$ANDROID_SDK_HOME/.android/debug.keystore"; fi
          echo "HOME=$HOME ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android | grep -E "SHA256"
          keytool -list -v -keystore "$HOME/.config/.android/debug.keystore" -storepass android | grep -E "SHA256"


      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon


      - name: Locate debug keystores used
        run: |
          find /home/runner /usr/lib/android-sdk -name "debug.keystore" 2>/dev/null | while read -r f; do echo "== $f"; keytool -list -v -keystore "$f" -storepass android 2>/dev/null | grep -E "SHA256" || echo "(unreadable)"; done


      - name: Prepare APK asset
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "TokiFonts-${VERSION}.apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "TokiFonts-${VERSION}.apk" | head -n 1
          ls -lh "TokiFonts-${VERSION}.apk"


      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokiFonts-${{ steps.apk.outputs.version }}
          path: TokiFonts-${{ steps.apk.outputs.version }}.apk


      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.apk.outputs.version }}
          files: TokiFonts-${{ steps.apk.outputs.version }}.apk
