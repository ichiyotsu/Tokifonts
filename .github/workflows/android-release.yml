name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore pinned debug keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.TOKI_DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK asset
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "tokifonts-${VERSION}-android.apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "tokifonts-${VERSION}-android.apk" | head -n 1
          ls -lh "tokifonts-${VERSION}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokifonts-${{ steps.apk.outputs.version }}-android
          path: tokifonts-${{ steps.apk.outputs.version }}-android.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tokifonts-${{ steps.apk.outputs.version }}-android.apk
